<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 河南高考志愿推荐系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-title">河南高考志愿推荐系统</div>
    <div class="login-subtitle">2026 预测版 · 河南考生志愿推荐</div>

    <div th:if="${param.error}" class="alert error">账号或密码错误，请重新输入。</div>
    <div th:if="${param.max}" class="alert error">该账号已在其他设备登录，请先在原设备退出后再登录。</div>
    <div th:if="${param.expired}" class="alert error">登录状态已失效，请重新登录。</div>
    <div th:if="${param.logout}" class="alert ok">已安全退出。</div>

    <form th:action="@{/doLogin}" method="post" autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>账号</label>
        <input name="username" placeholder="请输入账号" maxlength="50" required>
        <label>密码</label>
        <input name="password" type="password" placeholder="请输入密码" maxlength="50" required>
        <button type="submit">登录系统</button>
    </form>
</div>
</body>
</html>
