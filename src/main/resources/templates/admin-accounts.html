<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-body">
<header class="admin-top">
    <div>
        <h1>账号管理</h1>
        <p>商业版后台注册、停用和重置密码</p>
    </div>
    <nav>
        <a th:href="@{/admin}">后台首页</a>
        <a th:href="@{/}">推荐页</a>
    </nav>
</header>

<main class="admin-wrap">
    <div th:if="${ok}" class="alert ok" th:text="${ok}">成功</div>
    <div th:if="${error}" class="alert error" th:text="${error}">错误</div>

    <section class="admin-panel">
        <h2>新建账号</h2>
        <form th:action="@{/admin/accounts}" method="post" class="admin-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input name="username" placeholder="账号，字母/数字/下划线" required>
            <input name="password" type="password" placeholder="初始密码，至少 6 位" required>
            <select name="role">
                <option value="ROLE_USER">普通用户</option>
                <option value="ROLE_ADMIN">管理员</option>
            </select>
            <button type="submit">创建账号</button>
        </form>
    </section>

    <section class="admin-panel">
        <h2>已有账号</h2>
        <table class="admin-table account-table">
            <thead><tr><th>ID</th><th>账号</th><th>角色</th><th>状态</th><th>重置密码</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">admin</td>
                <td th:text="${user.role}">ROLE_ADMIN</td>
                <td th:text="${user.enabled} ? '启用' : '停用'">启用</td>
                <td>
                    <form th:action="@{'/admin/accounts/' + ${user.id} + '/password'}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input name="password" type="password" placeholder="新密码" required>
                        <button type="submit">重置</button>
                    </form>
                </td>
                <td>
                    <form th:if="${user.enabled}" th:action="@{'/admin/accounts/' + ${user.id} + '/disable'}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit">停用</button>
                    </form>
                    <form th:unless="${user.enabled}" th:action="@{'/admin/accounts/' + ${user.id} + '/enable'}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit">启用</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
