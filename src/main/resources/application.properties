server.port=8081
server.servlet.session.timeout=5m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.forward-headers-strategy=framework
spring.application.name=gaokao-recommend-system
spring.jmx.enabled=false
spring.main.lazy-initialization=true

server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2

# 默认用 H2 文件数据库，IDEA 直接运行即可；数据库文件在项目 data/gaokao_recommend_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/gaokao_recommend_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.h2.console.enabled=false

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

# 防止错误页暴露系统细节
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.org.springframework.jdbc.core=INFO
